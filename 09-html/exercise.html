<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Campus Store</title>

    <!-- The stylesheet sits next to this file, so a plain relative path. -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>My Campus Store</h1>
    </header>

    <main>
      <h2>Items</h2>

      <ul>
        <li>Notebook</li>
        <li>Pen</li>
        <li>Backpack</li>
      </ul>

      <p>A pen costs <span class="price">15 EGP</span>.</p>

      <p>Run by students at the <a href="https://www.giu-uni.de">GIU</a>.</p>

      <img src="notebook.jpg" alt="A spiral notebook lying open on a desk" />

      <p id="script-check">The script has not run.</p>
    </main>

    <footer>
      <p>My Campus Store, Winter 2026.</p>
    </footer>

    <!-- Last thing in the body, so the elements above exist when it runs. -->
    <script src="app.js"></script>
  </body>
</html>
